<!DOCTYPE html>
<html lang="en" data-theme="{{ request.cookies.get('edutrack-theme', 'light') }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In · EduTrack AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script>window.__EDUTRACK_THEME__ = "{{ request.cookies.get('edutrack-theme', 'light') }}";</script>
</head>
<body>
<div class="toast-stack" id="toastStack"></div>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div style="display:none;" data-flash="{{ message }}" data-category="{{ category }}"></div>
  {% endfor %}
{% endwith %}

<div class="auth-shell">
  <div class="auth-card fade-in-up">
    <div style="text-align:center;margin-bottom:26px;">
      <div class="logo-mark" style="width:52px;height:52px;border-radius:14px;margin:0 auto 14px;font-size:22px;">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h1 style="font-size:1.4rem;margin-bottom:4px;">Welcome to EduTrack AI</h1>
      <p class="section-sub">Sign in to manage students, marks &amp; AI insights</p>
    </div>

    <form method="POST">
      <div class="mb-3">
        <label class="form-label-modern">Username</label>
        <input type="text" name="username" class="form-control-modern" placeholder="admin" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label-modern">Password</label>
        <input type="password" name="password" class="form-control-modern" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 mt-2">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In
      </button>
    </form>

    <div style="margin-top:22px;padding:14px;border-radius:12px;background:var(--color-primary-light);font-size:0.8rem;color:var(--color-primary);">
      <i class="fa-solid fa-circle-info"></i> Default credentials: <b>admin</b> / <b>Admin@123</b>
      <br>Change this after first login in Profile settings.
    </div>
  </div>
</div>

<button class="theme-toggle" id="themeToggleBtn" style="position:fixed;bottom:20px;right:20px;">
  <i class="fa-solid fa-moon" id="themeToggleIcon"></i>
</button>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
