<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if server_error %}Server Error{% else %}Page Not Found{% endif %} · EduTrack AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card text-center">
    <div class="logo-mark" style="width:60px;height:60px;border-radius:16px;margin:0 auto 18px;font-size:26px;">
      <i class="fa-solid {% if server_error %}fa-triangle-exclamation{% else %}fa-compass{% endif %}"></i>
    </div>
    <h2 style="margin-bottom:8px;">{% if server_error %}Something went wrong{% else %}404 — Page not found{% endif %}</h2>
    <p class="section-sub mb-4">{% if server_error %}An unexpected error occurred. Our team has been notified.{% else %}The page you're looking for doesn't exist or has been moved.{% endif %}</p>
    <a href="/" class="btn btn-primary"><i class="fa-solid fa-house"></i> Back to Dashboard</a>
  </div>
</div>
</body>
</html>
