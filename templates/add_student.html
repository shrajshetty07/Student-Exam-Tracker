{% extends "base.html" %}
{% block title %}Add Student{% endblock %}
{% block page_title %}Add Student{% endblock %}
{% block page_sub %}Create a new student record{% endblock %}

{% block content %}
<div class="card-glass card-body-p" style="max-width:720px;">
  <form method="POST">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label-modern">Student ID <span class="text-muted">(leave blank to auto-generate)</span></label>
        <input type="text" name="student_id" class="form-control-modern" placeholder="STU1001" value="{{ form.get('student_id','') }}">
      </div>
      <div class="col-md-6">
        <label class="form-label-modern">Full Name *</label>
        <input type="text" name="name" class="form-control-modern" required value="{{ form.get('name','') }}">
      </div>
      <div class="col-md-6">
        <label class="form-label-modern">Gender *</label>
        <select name="gender" class="form-select-modern" required>
          <option value="">Select</option>
          <option value="Male" {% if form.get('gender')=='Male' %}selected{% endif %}>Male</option>
          <option value="Female" {% if form.get('gender')=='Female' %}selected{% endif %}>Female</option>
          <option value="Other" {% if form.get('gender')=='Other' %}selected{% endif %}>Other</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label-modern">Department *</label>
        <input list="deptList" name="department_name" class="form-control-modern" required value="{{ form.get('department_name','') }}" placeholder="e.g. Computer Science">
        <datalist id="deptList">
          {% for d in departments %}<option value="{{ d.name }}">{% endfor %}
        </datalist>
      </div>
      <div class="col-md-6">
        <label class="form-label-modern">Semester *</label>
        <select name="semester" class="form-select-modern" required>
          <option value="">Select</option>
          {% for i in range(1,9) %}
            <option value="{{ i }}" {% if form.get('semester')|string == i|string %}selected{% endif %}>Semester {{ i }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label-modern">Admission Year</label>
        <input type="number" name="admission_year" class="form-control-modern" placeholder="2024" value="{{ form.get('admission_year','') }}">
      </div>
      <div class="col-md-6">
        <label class="form-label-modern">Email</label>
        <input type="email" name="email" class="form-control-modern" value="{{ form.get('email','') }}">
      </div>
      <div class="col-md-6">
        <label class="form-label-modern">Phone</label>
        <input type="text" name="phone" class="form-control-modern" value="{{ form.get('phone','') }}">
      </div>
      <div class="col-md-6">
        <label class="form-label-modern">Date of Birth</label>
        <input type="date" name="date_of_birth" class="form-control-modern" value="{{ form.get('date_of_birth','') }}">
      </div>
    </div>

    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Student</button>
      <a href="{{ url_for('students.index') }}" class="btn btn-outline-soft">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
