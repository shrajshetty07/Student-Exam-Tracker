{% extends "base.html" %}
{% block title %}Edit Subject{% endblock %}
{% block page_title %}Edit Subject{% endblock %}
{% block page_sub %}{{ subject.subject_code }}{% endblock %}

{% block content %}
<div class="card-glass card-body-p" style="max-width:640px;">
  <form method="POST">
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label-modern">Subject Name *</label>
        <input type="text" name="subject_name" class="form-control-modern" required value="{{ subject.subject_name }}">
      </div>
      <div class="col-md-4">
        <label class="form-label-modern">Subject Code *</label>
        <input type="text" name="subject_code" class="form-control-modern" required value="{{ subject.subject_code }}">
      </div>
      <div class="col-md-6">
        <label class="form-label-modern">Department *</label>
        <input list="deptList" name="department_name" class="form-control-modern" required value="{{ subject.department_name }}">
        <datalist id="deptList">{% for d in departments %}<option value="{{ d.name }}">{% endfor %}</datalist>
      </div>
      <div class="col-md-3">
        <label class="form-label-modern">Semester *</label>
        <select name="semester" class="form-select-modern" required>
          {% for i in range(1,9) %}<option value="{{ i }}" {% if subject.semester == i %}selected{% endif %}>Semester {{ i }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label-modern">Credits</label>
        <input type="number" name="credits" class="form-control-modern" value="{{ subject.credits }}" min="1" max="6">
      </div>
    </div>
    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Update Subject</button>
      <a href="{{ url_for('subjects.index') }}" class="btn btn-outline-soft">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
